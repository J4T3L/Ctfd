<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DevNotes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-card" style="max-width: 580px;">
        <div class="card-header" style="text-align: left;">
            <span class="brand-badge">✅ Authenticated as {{ user['username'] }}</span>
            <h2>Welcome to DevNotes Vault</h2>
            <p>Role Level: <strong>{{ user['role'] }}</strong></p>
        </div>

        <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem;">
            <h4 style="color: var(--accent-emerald); margin-bottom: 0.5rem;">🔑 CONFIDENTIAL SYSTEM FLAG:</h4>
            <div style="font-family: var(--font-code); font-size: 1.1rem; color: #ffffff; background: #040711; padding: 0.8rem 1rem; border-radius: 6px; user-select: all; text-align: center;">
                {{ user['flag'] }}
            </div>
        </div>

        <div class="debug-box">
            <small style="color: #64748b; display: block; margin-bottom: 4px;">EXECUTED SQL QUERY:</small>
            <code>{{ query_used }}</code>
        </div>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">← Back to Login Portal</a>
        </div>
    </div>
</body>
</html>
