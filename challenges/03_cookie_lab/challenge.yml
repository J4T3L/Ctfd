name: "Cookie Session Manager"
author: "Modul Ajar Jarkom"
category: "Web Exploitation"
description: |
  Aplikasi ini mempercayai status peran pengguna yang disimpan di dalam cookie `user_session` berformat Base64.
  Dekode dan manipulasi nilai cookie tersebut untuk menaikkan akses menjadi `role=admin`!

  **Target Link**: [https://target.paradick.my.id/app/cookie](https://target.paradick.my.id/app/cookie)

