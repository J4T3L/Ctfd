<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShop - Business Logic Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-card" style="max-width: 650px;">
        <div style="margin-bottom: 1rem;"><a href="/" style="color: var(--text-secondary); text-decoration: none;">← Hub Portal</a></div>
        <div class="card-header" style="text-align: left;">
            <span class="brand-badge">MEDIUM/HARD • 350 PTS</span>
            <h2>CyberShop Item Store</h2>
            <p>Your Current Account Balance: <strong style="color: var(--accent-green); font-size: 1.2rem;">${{ balance }}</strong></p>
        </div>

        {% if message %}
        <div class="alert-error" style="background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.4); color: var(--accent-cyan);">
            <span>🛒</span>
            <div>{{ message }}</div>
        </div>
        {% endif %}

        <form action="/logic_shop/" method="POST" style="margin-bottom: 1.5rem;">
            <div style="background: #040711; border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 10px; margin-bottom: 1.2rem;">
                <h3>🚩 Admin Flag Item</h3>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.3rem;">Price: <strong>$1000</strong> per unit.</p>
            </div>

            <div class="form-group">
                <label class="form-label" for="quantity">Item Quantity</label>
                <input type="number" id="quantity" name="quantity" class="form-input" value="1" placeholder="Try negative quantity e.g. -10" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Purchase Flag Item 🛍️</button>
        </form>

        {% if flag %}
        <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); padding: 1.5rem; border-radius: 10px; text-align: center;">
            <h4 style="color: var(--accent-green); margin-bottom: 0.5rem;">🎉 PURCHASED FLAG:</h4>
            <div style="font-family: var(--font-code); font-size: 1.1rem; color: #fff; background: #040711; padding: 0.8rem; border-radius: 6px;">
                {{ flag }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
