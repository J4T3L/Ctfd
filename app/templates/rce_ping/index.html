<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Ping Diagnostic - RCE Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-card" style="max-width: 650px;">
        <div style="margin-bottom: 1rem;"><a href="/" style="color: var(--text-secondary); text-decoration: none;">← Hub Portal</a></div>
        <div class="card-header" style="text-align: left;">
            <span class="brand-badge">MEDIUM • 300 PTS</span>
            <h2>Network Ping Utility</h2>
            <p>Perform diagnostic ICMP ping checks on host IP addresses.</p>
        </div>

        <form action="/rce_ping/" method="POST" style="margin-bottom: 1.5rem;">
            <div class="form-group">
                <label class="form-label" for="ip">Target Host IP / Command</label>
                <input type="text" id="ip" name="ip" class="form-input" value="{{ target_ip or '127.0.0.1' }}" placeholder="127.0.0.1; cat /flag.txt" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Execute Ping Diagnostic ⚡</button>
        </form>

        {% if output %}
        <div class="glass-card" style="padding: 1.5rem;">
            <h4 style="color: var(--text-secondary); margin-bottom: 0.8rem; font-size: 0.85rem; text-transform: uppercase;">Execution Output</h4>
            <pre class="code-block" style="min-height: 140px;"><code>{{ output }}</code></pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
