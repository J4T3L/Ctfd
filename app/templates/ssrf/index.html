<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Content Fetcher - SSRF Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-card" style="max-width: 650px;">
        <div style="margin-bottom: 1rem;"><a href="/" style="color: var(--text-secondary); text-decoration: none;">← Hub Portal</a></div>
        <div class="card-header" style="text-align: left;">
            <span class="brand-badge">MEDIUM/HARD • 350 PTS</span>
            <h2>URL Content Fetcher</h2>
            <p>Fetch web pages remotely using server-side request architecture.</p>
        </div>

        <form action="/ssrf/" method="POST" style="margin-bottom: 1.5rem;">
            <div class="form-group">
                <label class="form-label" for="url">Target URL to Fetch</label>
                <input type="text" id="url" name="url" class="form-input" value="{{ target_url or 'http://httpbin.org/get' }}" placeholder="http://httpbin.org/get" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Fetch Remote URL 🌐</button>
        </form>

        {% if error %}
        <div class="alert-error">
            <span>⚠️</span>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        {% if fetched_content %}
        <div class="glass-card" style="padding: 1.5rem;">
            <h4 style="color: var(--text-secondary); margin-bottom: 0.8rem; font-size: 0.85rem; text-transform: uppercase;">HTTP Response Body</h4>
            <pre class="code-block" style="min-height: 140px;"><code>{{ fetched_content }}</code></pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
